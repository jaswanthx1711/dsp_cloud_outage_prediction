name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bumps a semver tag (vMAJOR.MINOR.PATCH) based on conventional commit
      # prefixes since the last tag (feat: -> minor, fix:/other -> patch,
      # BREAKING CHANGE -> major), and pushes the new tag.
      - name: Determine next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      # Creates a GitHub Release for the new tag with auto-generated notes
      # summarizing the commits/PRs merged since the previous release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
